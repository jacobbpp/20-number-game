name = "order20-community-stats"
main = "src/index.ts"
compatibility_date = "2026-07-19"

[[d1_databases]]
binding = "DB"
database_name = "order20-community-stats"
database_id = "49b5b071-db4b-4edf-91c5-1fafaf078dcd"

# Two schedules, both handled by scheduled() and told apart by controller.cron.
# ROLLUP_CRON in src/index.ts must match the first string and REMINDER_CRON the
# second; test/cron.test.ts reads this file and asserts they still do.
#
# 00:10 UTC is ten minutes after the day it summarises has ended, so there is
# no race with a game logged in the last seconds before midnight. 08:00 UTC is
# the daily reminder, which is 9am British summer time.
[triggers]
crons = ["10 0 * * *", "0 8 * * *"]

# The public half of the Web Push signing pair. Browsers are handed this to
# subscribe with, so it is not a secret. The private half is set separately
# with `wrangler secret put VAPID_PRIVATE_KEY` and never lives in this repo.
[vars]
VAPID_PUBLIC_KEY = "BPUHR96Z7cvcUYgYY5LnJgrLijZFH5fp9CRBHysc1kMgY2hS6wzTyJTXFqQSOJK_J0RdR-1DjvDi85a4V_YIeVY"

[[durable_objects.bindings]]
name = "ACTIVITY"
class_name = "ActivityFeed"

# Rate limiting lives in a Durable Object rather than the [[ratelimits]]
# binding. That binding was tried first and verified not to enforce on this
# worker: it was bound, limit() returned {success: true} with no error, and 20
# sequential requests against a temporary limit of 5 were all allowed. This
# does the counting itself, so it can be tested and demonstrated.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# new_sqlite_classes, not new_classes: the SQLite storage backend is the only
# one available on the Workers free plan. A new class needs its own migration
# tag rather than being added to an applied one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ActivityFeed"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]
